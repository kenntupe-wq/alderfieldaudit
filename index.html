<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;500;700&family=Share+Tech+Mono&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:#050810;
      color:white;
      font-family:'Rajdhani',sans-serif;
      overflow-x:hidden;
    }

    button,input{
      font-family:inherit;
    }

    #root{
      min-height:100vh;
    }

    @keyframes pulse{
      0%,100%{opacity:1;}
      50%{opacity:.55;}
    }

    @keyframes fadeUp{
      from{
        opacity:0;
        transform:translateY(20px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @keyframes scanline{
      0%{top:-4px;}
      100%{top:100%;}
    }

    @keyframes blink{
      0%,100%{opacity:1;}
      50%{opacity:0;}
    }

    .fade{
      animation:fadeUp .45s ease both;
    }

    .pulse{
      animation:pulse 1.2s infinite;
    }

    .blink{

    }

    input::placeholder{
      color:rgba(255,255,255,.25);
    }

    input:focus{
      outline:none;
      border-color:rgba(0,212,255,.5)!important;
    }

</head>

function seedFromAddress(address){

  let hash = 0;

  for(let i = 0; i < address.length; i++){
    hash = (hash * 31 + address.charCodeAt(i)) & 0xffff;
  }

  const highRisk = ROOMS
    .filter(r=>r.risk === "HIGH")
    .map(r=>r.id);

  const medRisk = ROOMS
    .filter(r=>r.risk === "MED")
    .map(r=>r.id);

  const pre = new Set();

  pre.add(highRisk[hash % highRisk.length]);
  pre.add(highRisk[(hash + 3) % highRisk.length]);
  pre.add(medRisk[hash % medRisk.length]);

  return pre;
}

function getFirstName(name){
  return name.trim().split(" ")[0] || name.trim();
}

function getStreet(address){
  return address.trim().split(",")[0] || address.trim();
}

  const [seconds,setSeconds] = useState(59);

  useEffect(()=>{

    const iv = setInterval(()=>{

      setScanY(y=> y >= 100 ? 0 : y + 1);

    },60);

    return ()=>clearInterval(iv);

  },[]);

  useEffect(()=>{

    if(screen !== "summary"){
      return;
    }

    const timer = setInterval(()=>{

      setSeconds(prev=>{

        if(prev === 0){

          setMinutes(m=>{

            if(m === 0){
              clearInterval(timer);
              return 0;
            }

            return m - 1;

          });

          return 59;
        }

        return prev - 1;

      });

    },1000);

    return ()=>clearInterval(timer);

  },[screen]);

  const handleIntroSubmit = (name,address)=>{

    setCustomerName(name);

    setCustomerAddress(address);

    const preSelected = seedFromAddress(address);

    setSelected(preSelected);

  const toggleRoom = (id)=>{

    setSelected(prev=>{

      const next = new Set(prev);

      if(next.has(id)){
        next.delete(id);
      }else{
        next.add(id);
      }

      return next;

    });

  };

  const selectedRooms = ROOMS.filter(r=>selected.has(r.id));

    );

  }

  return(

        style={{

        {
          [

              color:
                selected.size > 4

            }
          ].map(s=>(

            <div
              key={s.label}
              style={{
                background:"rgba(255,255,255,.03)",
                border:"1px solid rgba(255,255,255,.08)",
                borderRadius:12,
                padding:14
              }}
            >

              <div
                style={{
                  color:"rgba(255,255,255,.35)",
                  fontSize:10,
                  marginBottom:6,
                  fontFamily:"'Share Tech Mono',monospace"
                }}
              >
                {s.label}
              </div>

              <div
                style={{
                  color:s.color,
                  fontWeight:700,
                  fontSize:22
                }}
              >
                {s.value}
              </div>

            </div>

          ))
        }

      </div>

      <div
        style={{
          background:"rgba(255,255,255,.02)",
          border:"1px solid rgba(255,255,255,.08)",
          borderRadius:18,
          padding:16,
          position:"relative",
          overflow:"hidden",
          marginBottom:20
        }}
      >

        <div
          style={{
            position:"absolute",
            left:0,
            right:0,
            top:`${scanY}%`,
            height:2,
            background:"linear-gradient(90deg,transparent,#00d4ff,transparent)"
          }}
        />

        <div
          style={{
            marginBottom:14,
            color:"rgba(255,255,255,.45)",
            fontSize:12
          }}
        >
          TAP ZONES TO FLAG AS UNPROTECTED
        </div>

        <div
          style={{
            display:"grid",
            gridTemplateColumns:"1fr 1fr 1fr",
            gridTemplateRows:"1fr 1fr 1fr",
            gap:8,
            height:320
          }}
        >

          {
            ROOMS.map(room=>{

              const active = selected.has(room.id);

              const rc = COLORS[room.risk];

              return(

                <button
                  key={room.id}
                  onClick={()=>toggleRoom(room.id)}
                  onMouseEnter={()=>setHovered(room.id)}
                  onMouseLeave={()=>setHovered(null)}
                  style={{
                    gridColumn:room.col,
                    gridRow:room.row,
                    borderRadius:12,
                    border:
                      active
                      ? `1px solid ${rc.border}`
                      : "1px solid rgba(255,255,255,.08)",
                    background:
                      active
                      ? rc.bg
                      : "rgba(255,255,255,.03)",
                    color:"white",
                    cursor:"pointer",
                    transition:".2s",
                    boxShadow:
                      active
                      ? `0 0 20px ${rc.glow}`
                      : "none"
                  }}
                >

                  <div
                    style={{
                      fontWeight:700,
                      marginBottom:6,
                      fontSize:14
                    }}
                  >
                    {room.label}
                  </div>

                  {
                    active && (

                      <div
                        style={{
                          color:rc.text,
                          fontSize:11,
                          fontFamily:
                            "'Share Tech Mono',monospace"
                        }}
                      >
                        {room.risk} RISK
                      </div>

                    )
                  }

                </button>

              );

            })
          }

        </div>

      </div>

      {
        hovered && !selected.has(hovered) && (

          <div
            className="fade"
            style={{
              marginBottom:18,
              background:"rgba(0,212,255,.04)",
              border:"1px solid rgba(0,212,255,.15)",
              borderRadius:14,
              padding:14
            }}
          >

            <div
              style={{
                color:"#00d4ff",
                marginBottom:8,
                fontSize:11,
                fontFamily:"'Share Tech Mono',monospace"
              }}
            >
              RECOMMENDED PROTECTION
            </div>

            <div
              style={{
                color:"rgba(255,255,255,.75)"
              }}
            >
              {
                ROOMS
                .find(r=>r.id === hovered)
                ?.devices.join(" • ")
              }
            </div>

          </div>

        )
      }

      <button
        onClick={()=>{
          if(selected.size > 0){
            setScreen("summary");
          }
        }}
        style={{
          width:"100%",
          padding:18,
          borderRadius:14,
          border:"none",
          background:
            selected.size > 0
            ? "linear-gradient(135deg,#00d4ff,#0099cc)"
            : "rgba(255,255,255,.08)",
          color:
            selected.size > 0
            ? "#050810"
            : "rgba(255,255,255,.35)",
          fontWeight:700,
          fontSize:14,
          cursor:
            selected.size > 0
            ? "pointer"
            : "default",
          boxShadow:
            selected.size > 0
            ? "0 0 30px rgba(0,212,255,.25)"
            : "none"
        }}
      >
        {
          selected.size > 0
          ? `ANALYZE ${selected.size} ZONES →`
          : "SELECT UNPROTECTED ZONES"
        }
      </button>

    </div>

  );

}

ReactDOM.createRoot(
  document.getElementById("root")
).render(<App />);

</script>

</body>
</html>
