<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SHIELD_OS v5.2.1 — Home Audit</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;500;700&family=Syncopate:wght@400;700&display=swap');
    
    * { box-sizing: border-box; margin:0; padding:0; }
    body {
      background: #050810;
      color: #e2e8f0;
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    @keyframes flicker { 0%,100%{opacity:1} 50%{opacity:0.85} }
    @keyframes slide-up { from{transform:translateY(30px);opacity:0} to{transform:translateY(0);opacity:1} }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    .noise {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0.04; pointer-events: none; z-index: 0;
      background: repeating-linear-gradient(45deg, transparent, transparent 4px, #111 4px, #111 8px);
    }

    .zone {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      transition: all 0.2s;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }
    .zone:hover, .zone.active {
      border-color: #00d4ff;
      box-shadow: 0 0 15px rgba(0,212,255,0.4);
    }
    .zone.active {
      background: rgba(255,59,92,0.15);
      border-color: #ff3b5c;
    }
  </style>
</head>
<body>
  <div class="noise"></div>
  <div id="root"></div>

  <script>
    const ROOMS = [ /* paste your full ROOMS array here */ ];
    // ... RISK_COLORS and BASE_PRICE ...

    let selected = new Set();
    let screen = "audit";
    let scanY = 0;
    let hoveredRoom = null;
    let form = { name: "", address: "", email: "", phone: "" };

    function toggleRoom(id) {
      if (selected.has(id)) selected.delete(id);
      else selected.add(id);
      render();
    }

    function getMonthly() {
      return 29.99 + Array.from(selected).reduce((sum, id) => {
        const r = ROOMS.find(room => room.id === id);
        return sum + (r ? r.price : 0);
      }, 0);
    }

    // Scan line
    setInterval(() => {
      scanY = (scanY + 0.8) % 100;
      if (screen === "audit") render();
    }, 40);

    function render() {
      const root = document.getElementById("root");
      const totalMonthly = getMonthly();
      const integrityScore = Math.max(0, 100 - selected.size * 10);
      const selectedRooms = ROOMS.filter(r => selected.has(r.id));

      if (screen === "audit") {
        let html = `
          <div style="max-width:480px;margin:0 auto;padding:20px;position:relative;z-index:1">
            <div style="margin-bottom:25px">
              <div style="font-family:'Share Tech Mono',monospace;font-size:10;color:#00d4ff">SHIELD_OS v5.2.1</div>
              <div style="font-family:'Syncopate',sans-serif;font-size:21;font-weight:700">HOME VULNERABILITY AUDIT</div>
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:20px">
              <div style="background:rgba(255,255,255,0.03);border:1px solid rgba(0,212,255,0.2);border-radius:10;padding:12px;text-align:center">
                <div style="font-size:9;color:#aaa">INTEGRITY</div>
                <div style="font-size:26;color:#00d4ff">${integrityScore}%</div>
              </div>
              <div style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,59,92,0.2);border-radius:10;padding:12px;text-align:center">
                <div style="font-size:9;color:#aaa">GAPS</div>
                <div style="font-size:26;color:#ff3b5c">${selected.size}</div>
              </div>
              <div style="background:rgba(255,255,255,0.03);border:1px solid rgba(245,158,11,0.2);border-radius:10;padding:12px;text-align:center">
                <div style="font-size:9;color:#aaa">THREAT</div>
                <div style="font-size:22;color:#f59e0b">${selected.size >= 4 ? 'HIGH' : selected.size > 0 ? 'MED' : 'LOW'}</div>
              </div>
            </div>

            <div style="background:rgba(255,255,255,0.015);border:1px solid rgba(255,255,255,0.1);border-radius:16;padding:16px;position:relative;overflow:hidden">
              <div style="position:absolute;left:0;right:0;height:3px;top:${scanY}%;background:linear-gradient(90deg,transparent,#00d4ff,transparent);z-index:5"></div>
              
              <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;height:310px">
        `;

        ROOMS.forEach(room => {
          const isActive = selected.has(room.id);
          const rc = RISK_COLORS[room.risk];
          html += `
            <div class="zone ${isActive ? 'active' : ''}" data-id="${room.id}" style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;text-align:center">
              <div style="font-size:13px;font-weight:700;color:${isActive ? rc.label : '#ccc'}">${room.label}</div>
              ${isActive ? `<div style="font-size:10px;color:${rc.label};margin-top:4px">${room.risk}</div>` : ''}
            </div>`;
        });

        html += `
              </div>
            </div>

            <button id="analyzeBtn" style="width:100%;margin-top:25px;padding:18px;background:${selected.size > 0 ? 'linear-gradient(135deg,#00d4ff,#0088cc)' : '#1f283f'};color:${selected.size > 0 ? '#050810' : '#777'};border:none;border-radius:10;font-weight:700">
              ${selected.size > 0 ? `ANALYZE ${selected.size} ZONE${selected.size > 1 ? 'S' : ''} →` : 'SELECT ZONES TO BEGIN'}
            </button>
          </div>
        `;

        root.innerHTML = html;

        // Add click listeners after rendering
        document.querySelectorAll('.zone').forEach(el => {
          el.addEventListener('click', () => {
            toggleRoom(el.dataset.id);
          });
        });

        document.getElementById('analyzeBtn').addEventListener('click', () => {
          if (selected.size > 0) {
            screen = "summary";
            render();
          }
        });
      } 
      else if (screen === "summary") {
        // Summary screen with Integrity Arc (add your full version here)
        root.innerHTML = `<div style="padding:20px"><h2 style="color:#00d4ff">Summary Screen</h2><button onclick="screen='audit';render()">Back</button></div>`;
      }
      // Add quote and submitted screens similarly
    }

    window.onload = render;
  </script>
</body>
</html>
