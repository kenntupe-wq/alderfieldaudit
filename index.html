<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tactical HUD | Security Audit</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Inter:wght@300;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan: #00f2ff;
            --danger: #ff0055;
            --bg: #05070a;
            --panel: #0d1117;
        }

        body {
            background: var(--bg);
            color: white;
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        /* Tactical HUD Elements */
        .hud-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            border: 20px solid rgba(0, 242, 255, 0.05);
            box-sizing: border-box;
            z-index: 100;
        }

        .container { max-width: 500px; margin: auto; padding: 20px; position: relative; }

        header { text-align: left; margin-bottom: 20px; border-left: 3px solid var(--cyan); padding-left: 15px; }
        h1 { font-family: 'Orbitron', sans-serif; font-size: 1rem; letter-spacing: 2px; margin: 0; color: var(--cyan); }
        .coords { font-family: monospace; font-size: 0.7rem; opacity: 0.5; }

        /* The Blueprint Map */
        .map-container {
            position: relative;
            background: var(--panel);
            border: 1px solid #1a212e;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }

        .blueprint {
            width: 100%;
            height: 300px;
            display: grid;
            grid-template-areas: 
                "garage garage front"
                "living living front"
                "bed master master";
            gap: 10px;
        }

        .room {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 242, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            transition: 0.3s;
            position: relative;
        }

        .room:hover { background: rgba(0, 242, 255, 0.05); }

        .room.vulnerable {
            border-color: var(--danger);
            background: rgba(255, 0, 85, 0.15);
            color: var(--danger);
            box-shadow: inset 0 0 15px rgba(255, 0, 85, 0.2);
        }

        /* Scanning Line Animation */
        .scan-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: rgba(0, 242, 255, 0.3);
            top: 0;
            animation: scan 4s linear infinite;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .status-box {
            display: flex;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.02);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .stat-label { font-size: 0.6rem; color: var(--cyan); text-transform: uppercase; display: block; }
        .stat-value { font-family: 'Orbitron', sans-serif; font-size: 1.2rem; }

        .btn-action {
            width: 100%;
            padding: 20px;
            background: var(--cyan);
            color: black;
            border: none;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            border-radius: 5px;
            cursor: pointer;
            clip-path: polygon(0 0, 95% 0, 100% 30%, 100% 100%, 5% 100%, 0 70%);
        }

        /* Screen 2 Styles */
        #quote-screen { display: none; }
        .price-card { background: #111; border: 1px solid var(--cyan); padding: 30px; text-align: center; border-radius: 10px; }

    </style>
</head>
<body>

<div class="hud-overlay"></div>

<div class="container" id="audit-screen">
    <header>
        <h1>SITE_AUDIT_V5.0</h1>
        <div class="coords">NODE_ID: SLC_801 // STATUS: ACTIVE_SCAN</div>
    </header>

    <div class="map-container">
        <div class="scan-line"></div>
        <div class="blueprint">
            <div class="room" style="grid-area: garage;" onclick="tag(this)">Garage</div>
            <div class="room" style="grid-area: front;" onclick="tag(this)">Entry</div>
            <div class="room" style="grid-area: living;" onclick="tag(this)">Living</div>
            <div class="room" style="grid-area: bed;" onclick="tag(this)">Bedroom</div>
            <div class="room" style="grid-area: master;" onclick="tag(this)">Master</div>
        </div>
    </div>

    <div class="status-box">
        <div>
            <span class="stat-label">Integrity</span>
            <span class="stat-value" id="score">100%</span>
        </div>
        <div style="text-align: right;">
            <span class="stat-label">Detected Gaps</span>
            <span class="stat-value" id="gaps">00</span>
        </div>
    </div>

    <button class="btn-action" onclick="finalize()">Initialize Solution</button>
</div>

<div class="container" id="quote-screen">
    <header>
        <h1>OPTIMIZED_CONFIG</h1>
    </header>
    <div class="price-card">
        <div style="font-size: 0.8rem; opacity: 0.6; text-decoration: line-through;">MSRP: $109.99</div>
        <div style="font-size: 3.5rem; font-family: 'Orbitron', sans-serif; color: var(--cyan);">$69.99</div>
        <div style="font-size: 0.7rem; letter-spacing: 2px;">PER MONTH / SECURED RATE</div>
    </div>
    <p style="text-align: center; font-size: 0.8rem; margin: 20px 0;">Submit details to lock this configuration to your address.</p>
    <!-- Add your form here -->
</div>

<script>
    let vulnPoints = 0;
    function tag(el) {
        el.classList.toggle('vulnerable');
        vulnPoints = document.querySelectorAll('.vulnerable').length;
        document.getElementById('gaps').innerText = vulnPoints.toString().padStart(2, '0');
        let score = 100 - (vulnPoints * 18);
        document.getElementById('score').innerText = (score < 0 ? 0 : score) + "%";
        document.getElementById('score').style.color = score < 50 ? '#ff0055' : '#00f2ff';
    }

    function finalize() {
        if(vulnPoints === 0) {
            alert("Select vulnerable entry points first.");
            return;
        }
        document.querySelector('.btn-action').innerText = "CALCULATING...";
        setTimeout(() => {
            document.getElementById('audit-screen').style.display = 'none';
            document.getElementById('quote-screen').style.display = 'block';
        }, 1200);
    }
</script>

</body>
</html>
