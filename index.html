<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHIELD_OS v5.2.1 — Mississippi Home Audit</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;500;700&family=Syncopate:wght@400;700&display=swap');
    
    * { box-sizing: border-box; margin:0; padding:0; }
    body {
      background: #050810;
      color: #e2e8f0;
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    @keyframes flicker { 0%,100%{opacity:1} 50%{opacity:0.85} }
    @keyframes slide-up { from{transform:translateY(30px);opacity:0} to{transform:translateY(0);opacity:1} }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    .noise {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0.035; pointer-events: none; z-index: 0;
      background: repeating-linear-gradient(45deg, transparent, transparent 4px, #111 4px, #111 8px);
    }
    .corner {
      position: fixed; width: 28px; height: 28px; z-index: 200; pointer-events: none;
      border: 2px solid #00d4ff;
    }
  </style>
</head>
<body>
  <div class="noise"></div>
  
  <!-- Corner Brackets -->
  <div class="corner" style="top:12px;left:12px;border-top:none;border-left:none;"></div>
  <div class="corner" style="top:12px;right:12px;border-top:none;border-right:none;"></div>
  <div class="corner" style="bottom:12px;left:12px;border-bottom:none;border-left:none;"></div>
  <div class="corner" style="bottom:12px;right:12px;border-bottom:none;border-right:none;"></div>

  <div id="root"></div>

  <script>
    const ROOMS = [ /* your full ROOMS array */ ];
    // (paste the full ROOMS array here from your code)

    const RISK_COLORS = { /* your full RISK_COLORS */ };
    const BASE_PRICE = 29.99;

    let selected = new Set();
    let screen = "audit";
    let scanY = 0;
    let hoveredRoom = null;
    let form = { name: "", address: "", email: "", phone: "" };

    function toggleRoom(id) {
      if (selected.has(id)) selected.delete(id);
      else selected.add(id);
      render();
    }

    function getMonthly() {
      return BASE_PRICE + Array.from(selected).reduce((sum, id) => {
        const r = ROOMS.find(room => room.id === id);
        return sum + (r ? r.price : 0);
      }, 0);
    }

    // Scan animation
    setInterval(() => {
      scanY = (scanY + 0.7) % 100;
      if (screen === "audit") render();
    }, 35);

    function createIntegrityArc(score) {
      const r = 38;
      const circ = 2 * Math.PI * r;
      const dash = (score / 100) * circ;
      const color = score > 60 ? "#00d4ff" : score > 30 ? "#f59e0b" : "#ff3b5c";
      return `
        <svg width="100" height="100" style="transform:rotate(-90deg)">
          <circle cx="50" cy="50" r="${r}" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="7"/>
          <circle cx="50" cy="50" r="${r}" fill="none" stroke="${color}" stroke-width="7"
            stroke-dasharray="${dash} ${circ}" stroke-linecap="round"
            style="filter: drop-shadow(0 0 8px ${color});"/>
          <text x="50" y="50" text-anchor="middle" dominant-baseline="middle"
            style="fill:${color};font-family:'Share Tech Mono',monospace;font-size:14px;transform:rotate(90deg);transform-origin:50px 50px;">
            ${score}%
          </text>
        </svg>`;
    }

    function render() {
      const root = document.getElementById("root");
      const totalMonthly = getMonthly();
      const integrityScore = Math.max(0, 100 - selected.size * 10);
      const selectedRooms = ROOMS.filter(r => selected.has(r.id));

      if (screen === "submitted") {
        root.innerHTML = `...`; // keep your nice secured screen
        return;
      }

      if (screen === "quote") {
        // full form screen (your original)
        root.innerHTML = `...`; // I can expand if needed
        return;
      }

      if (screen === "summary") {
        root.innerHTML = `
          <div style="max-width:480px;margin:0 auto;padding:24px 20px">
            <button onclick="screen='audit';render()" style="background:none;border:1px solid rgba(255,255,255,0.2);color:rgba(255,255,255,0.6);padding:8px 16px;border-radius:6">← BACK</button>
            
            <div style="margin:25px 0 20px;display:flex;align-items:center;gap:20px">
              ${createIntegrityArc(integrityScore)}
              <div>
                <div style="color:#00d4ff;font-size:13">HOME INTEGRITY SCORE</div>
                <div style="font-size:26;font-weight:700;color:${integrityScore>60?'#00d4ff':'#ff3b5c'}">
                  ${integrityScore > 70 ? "MODERATE RISK" : integrityScore > 40 ? "HIGH RISK" : "CRITICAL"}
                </div>
              </div>
            </div>

            <!-- Zone list + Total + CTA -->
            ${selectedRooms.map(r => { /* your zone cards */ }).join('')}
            
            <button onclick="screen='quote';render()" style="width:100%;padding:18px;margin-top:20px;background:linear-gradient(135deg,#00d4ff,#0099cc);border:none;border-radius:10;color:#050810;font-weight:700">
              SECURE MY HOME →
            </button>
          </div>
        `;
        return;
      }

      // Audit Screen (main)
      root.innerHTML = `
        <div style="max-width:480px;margin:0 auto;padding:24px 20px">
          <div style="margin-bottom:28px">
            <div style="font-family:'Share Tech Mono',monospace;font-size:10;color:#00d4ff">SHIELD_OS v5.2.1 — MISSISSIPPI</div>
            <div style="font-family:'Syncopate',sans-serif;font-size:22;font-weight:700;letter-spacing:1.5">HOME VULNERABILITY AUDIT</div>
          </div>

          <!-- Stats -->
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:20px">
            <!-- your 3 stat cards -->
          </div>

          <!-- Blueprint -->
          <div style="background:rgba(255,255,255,0.015);border:1px solid rgba(255,255,255,0.08);border-radius:16;padding:16px;position:relative;overflow:hidden">
            <div style="position:absolute;left:0;right:0;height:3px;top:${scanY}%;background:linear-gradient(90deg,transparent,#00d4ff,transparent);z-index:5"></div>
            
            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;height:300px">
              ${ROOMS.map(room => { /* your grid items with hover + selection */ }).join('')}
            </div>
          </div>

          <button onclick="if(selected.size>0){screen='summary';render()}" style="width:100%;margin-top:25px;padding:18px;background:${selected.size>0?'linear-gradient(135deg,#00d4ff,#0099cc)':'#1f2a44'};color:${selected.size>0?'#050810':'#777'};border:none;border-radius:10;font-weight:700">
            ${selected.size > 0 ? `ANALYZE ${selected.size} ZONES →` : "SELECT ZONES TO BEGIN"}
          </button>
        </div>
      `;
    }

    window.onload = render;
  </script>
</body>
</html>
