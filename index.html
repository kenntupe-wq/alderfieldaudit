<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Alder Home Security Audit</title>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;500;700&family=Share+Tech+Mono&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">

  <style>
    *,
    *::before,
    *::after{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:#050810;
      color:white;
      font-family:'Rajdhani',sans-serif;
      overflow-x:hidden;
    }

    button,
    input{
      font-family:inherit;
    }

    #root{
      min-height:100vh;
    }

    @keyframes pulse{
      0%,100%{opacity:1;}
      50%{opacity:.55;}
    }

    @keyframes fadeUp{
      from{
        opacity:0;
        transform:translateY(20px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @keyframes scanline{
      0%{top:-4px;}
      100%{top:100%;}
    }

    .fade{
      animation:fadeUp .45s ease both;
    }

    .pulse{
      animation:pulse 1.2s infinite;
    }

    input::placeholder{
      color:rgba(255,255,255,.25);
    }

    input:focus{
      outline:none;
      border-color:rgba(0,212,255,.5)!important;
    }
  </style>
</head>

<body>

<div id="root"></div>

<script type="text/babel">

const { useState, useEffect, useRef } = React;

const BASE_PRICE = 29.99;

const ROOMS = [
  {
    id:"front",
    label:"Front Door",
    risk:"HIGH",
    devices:["Doorbell Camera","Smart Lock","Motion Sensor"],
    price:24.99,
    col:2,
    row:1
  },

  {
    id:"garage",
    label:"Garage",
    risk:"HIGH",
    devices:["Garage Sensor","Outdoor Camera"],
    price:18.99,
    col:1,
    row:1
  },

  {
    id:"living",
    label:"Living Room",
    risk:"MED",
    devices:["Glass Break","Motion Sensor"],
    price:14.99,
    col:1,
    row:2
  },

  {
    id:"kitchen",
    label:"Kitchen",
    risk:"LOW",
    devices:["Smoke + CO Sensor"],
    price:9.99,
    col:2,
    row:2
  },

  {
    id:"master",
    label:"Master Bedroom",
    risk:"MED",
    devices:["Window Sensor","Motion Sensor"],
    price:12.99,
    col:3,
    row:1
  },

  {
    id:"bed2",
    label:"Bedroom 2",
    risk:"LOW",
    devices:["Window Sensor"],
    price:7.99,
    col:3,
    row:2
  },

  {
    id:"backyard",
    label:"Back Yard",
    risk:"HIGH",
    devices:["Floodlight Camera","Motion Sensor"],
    price:19.99,
    col:2,
    row:3
  },

  {
    id:"driveway",
    label:"Driveway",
    risk:"MED",
    devices:["Outdoor Camera"],
    price:14.99,
    col:3,
    row:3
  },

  {
    id:"basement",
    label:"Basement",
    risk:"HIGH",
    devices:["Flood Sensor","Indoor Camera"],
    price:16.99,
    col:1,
    row:3
  }
];

const COLORS = {
  HIGH:{
    border:"#ff3b5c",
    bg:"rgba(255,59,92,.12)",
    glow:"rgba(255,59,92,.4)",
    text:"#ff3b5c"
  },

  MED:{
    border:"#f59e0b",
    bg:"rgba(245,158,11,.12)",
    glow:"rgba(245,158,11,.4)",
    text:"#f59e0b"
  },

  LOW:{
    border:"#10b981",
    bg:"rgba(16,185,129,.12)",
    glow:"rgba(16,185,129,.4)",
    text:"#10b981"
  }
};

function seedFromAddress(address){

  let hash = 0;

  for(let i = 0; i < address.length; i++){
    hash = (hash * 31 + address.charCodeAt(i)) & 0xffff;
  }

  const highRisk = ROOMS
    .filter(r=>r.risk === "HIGH")
    .map(r=>r.id);

  const medRisk = ROOMS
    .filter(r=>r.risk === "MED")
    .map(r=>r.id);

  const pre = new Set();

  pre.add(highRisk[hash % highRisk.length]);
  pre.add(highRisk[(hash + 3) % highRisk.length]);
  pre.add(medRisk[hash % medRisk.length]);

  return pre;
}

function getFirstName(name){
  return name.trim().split(" ")[0] || name.trim();
}

function getStreet(address){
  return address.trim().split(",")[0] || address.trim();
}

function IntroScreen({ onSubmit }){

  const [name,setName] = useState("");
  const [address,setAddress] = useState("");
  const [scanning,setScanning] = useState(false);
  const [scanStep,setScanStep] = useState(0);

  const nameRef = useRef();

  useEffect(()=>{
    nameRef.current?.focus();
  },[]);

  const scanSteps = [
    "INITIALIZING SECURITY SCAN...",
    "LOCATING ADDRESS...",
    `MAPPING PROPERTY: ${getStreet(address).toUpperCase() || "—"}`,
    "IDENTIFYING ENTRY POINTS...",
    "VULNERABILITY ANALYSIS COMPLETE"
  ];

  const handleStart = (e)=>{

    e.preventDefault();

    if(!name.trim() || !address.trim()){
      return;
    }

    setScanning(true);

    let step = 0;

    const iv = setInterval(()=>{

      step++;

      setScanStep(step);

      if(step >= scanSteps.length - 1){

        clearInterval(iv);

        setTimeout(()=>{
          onSubmit(name.trim(),address.trim());
        },600);

      }

    },520);

  };

  if(scanning){

    return(

      <div
        className="fade"
        style={{
          minHeight:"100vh",
          display:"flex",
          justifyContent:"center",
          alignItems:"center",
          padding:24
        }}
      >

        <div style={{width:"100%",maxWidth:420}}>

          <div
            style={{
              fontFamily:"'Share Tech Mono',monospace",
              fontSize:11,
              color:"#00d4ff",
              marginBottom:24,
              letterSpacing:2
            }}
          >
            ALDER SECURITY NODE • SCANNING
          </div>

          <div
            style={{
              background:"rgba(0,212,255,.03)",
              border:"1px solid rgba(0,212,255,.15)",
              borderRadius:16,
              padding:24,
              position:"relative",
              overflow:"hidden"
            }}
          >

            <div
              style={{
                position:"absolute",
                left:0,
                right:0,
                height:2,
                background:"linear-gradient(90deg,transparent,#00d4ff,transparent)",
                animation:"scanline 1.2s linear infinite",
                top:0
              }}
            />

            <div
              style={{
                fontFamily:"'Syncopate',sans-serif",
                fontSize:15,
                fontWeight:700,
                marginBottom:20
              }}
            >
              SCANNING PROPERTY
            </div>

            <div
              style={{
                display:"flex",
                flexDirection:"column",
                gap:10
              }}
            >

              {
                scanSteps.map((s,i)=>(

                  <div
                    key={i}
                    style={{
                      display:"flex",
                      alignItems:"center",
                      gap:10,
                      opacity:i <= scanStep ? 1 : .2
                    }}
                  >

                    <div
                      style={{
                        width:8,
                        height:8,
                        borderRadius:"50%",
                        background:
                          i < scanStep
                          ? "#10b981"
                          : i === scanStep
                          ? "#00d4ff"
                          : "rgba(255,255,255,.15)"
                      }}
                    />

                    <div
                      style={{
                        fontFamily:"'Share Tech Mono',monospace",
                        fontSize:11,
                        color:
                          i < scanStep
                          ? "#10b981"
                          : i === scanStep
                          ? "#00d4ff"
                          : "rgba(255,255,255,.3)"
                      }}
                    >
                      {s}
                    </div>

                  </div>

                ))
              }

            </div>

          </div>

        </div>

      </div>

    );

  }

  return(

    <div
      className="fade"
      style={{
        minHeight:"100vh",
        display:"flex",
        justifyContent:"center",
        alignItems:"center",
        padding:24
      }}
    >

      <div style={{width:"100%",maxWidth:420}}>

        <div
          style={{
            fontFamily:"'Share Tech Mono',monospace",
            fontSize:11,
            color:"#00d4ff",
            marginBottom:16,
            letterSpacing:2
          }}
        >
          ALDER SECURITY NODE •
          <span
            className="pulse"
            style={{
              color:"#ff3b5c",
              marginLeft:6
            }}
          >
            ■ LIVE
          </span>
        </div>

        <div
          style={{
            fontFamily:"'Syncopate',sans-serif",
            fontSize:"clamp(18px,5vw,22px)",
            lineHeight:1.2,
            marginBottom:8
          }}
        >
          HOME SECURITY
          <br/>
          VULNERABILITY AUDIT
        </div>

        <div
          style={{
            color:"rgba(255,255,255,.45)",
            fontSize:14,
            marginBottom:28,
            lineHeight:1.5
          }}
        >
          Enter your address to run a free security scan and identify unprotected zones in your home.
        </div>

        <form onSubmit={handleStart}>

          <div style={{marginBottom:12}}>

            <input
              ref={nameRef}
              required
              type="text"
              placeholder="Full Name"
              value={name}
              onChange={(e)=>setName(e.target.value)}
              style={{
                width:"100%",
                padding:"14px 16px",
                borderRadius:10,
                border:"1px solid rgba(255,255,255,.1)",
                background:"rgba(255,255,255,.04)",
                color:"white",
                fontSize:15
              }}
            />

          </div>

          <div style={{marginBottom:20}}>

            <input
              required
              type="text"
              placeholder="123 Main St"
              value={address}
              onChange={(e)=>setAddress(e.target.value)}
              style={{
                width:"100%",
                padding:"14px 16px",
                borderRadius:10,
                border:"1px solid rgba(255,255,255,.1)",
                background:"rgba(255,255,255,.04)",
                color:"white",
                fontSize:15
              }}
            />

          </div>

          <button
            type="submit"
            style={{
              width:"100%",
              padding:18,
              borderRadius:12,
              border:"none",
              background:"linear-gradient(135deg,#00d4ff,#0099cc)",
              color:"#050810",
              fontWeight:700,
              cursor:"pointer",
              boxShadow:"0 0 30px rgba(0,212,255,.25)"
            }}
          >
            RUN SECURITY SCAN →
          </button>

        </form>

      </div>

    </div>

  );

}

function App(){

  const [screen,setScreen] = useState("intro");

  const [customerName,setCustomerName] = useState("");

  const [customerAddress,setCustomerAddress] = useState("");

  const [selected,setSelected] = useState(new Set());

  const [hovered,setHovered] = useState(null);

  const [scanY,setScanY] = useState(0);

  useEffect(()=>{

    const iv = setInterval(()=>{

      setScanY(y=> y >= 100 ? 0 : y + 1);

    },60);

    return ()=>clearInterval(iv);

  },[]);

  const handleIntroSubmit = (name,address)=>{

    setCustomerName(name);

    setCustomerAddress(address);

    const preSelected = seedFromAddress(address);

    setSelected(preSelected);

    setScreen("audit");

  };

  const toggleRoom = (id)=>{

    setSelected(prev=>{

      const next = new Set(prev);

      if(next.has(id)){
        next.delete(id);
      }else{
        next.add(id);
      }

      return next;

    });

  };

  const selectedRooms = ROOMS.filter(r=>selected.has(r.id));

  const monthlyAdd = selectedRooms.reduce(
    (acc,r)=>acc + r.price,
    0
  );

  const totalMonthly = BASE_PRICE + monthlyAdd;

  const integrity = Math.max(
    0,
    100 - selected.size * 10
  );

  const street = getStreet(customerAddress);

  return(

    <div
      style={{
        maxWidth:500,
        margin:"0 auto",
        padding:20
      }}
    >

      {
        screen === "intro"
        ? (
          <IntroScreen onSubmit={handleIntroSubmit} />
        )
        : (
          <>

            <div style={{marginBottom:20}}>

              <div
                style={{
                  fontFamily:"'Share Tech Mono',monospace",
                  fontSize:11,
                  color:"#00d4ff",
                  marginBottom:10,
                  letterSpacing:1
                }}
              >
                ALDER SECURITY NODE •
                <span
                  className="pulse"
                  style={{
                    color:"#ff3b5c",
                    marginLeft:6
                  }}
                >
                  ■ LIVE AUDIT
                </span>
              </div>

              <div
                style={{
                  fontFamily:"'Syncopate',sans-serif",
                  fontSize:"clamp(18px,5vw,20px)",
                  lineHeight:1.15,
                  marginBottom:10
                }}
              >
                HOME SECURITY
                <br/>
                VULNERABILITY AUDIT
              </div>

              <div
                className="fade"
                style={{
                  display:"inline-flex",
                  alignItems:"center",
                  gap:8,
                  background:"rgba(0,212,255,.06)",
                  border:"1px solid rgba(0,212,255,.2)",
                  borderRadius:10,
                  padding:"8px 14px",
                  marginBottom:18,
                  boxShadow:"0 0 20px rgba(0,212,255,.08)"
                }}
              >

                <div
                  className="pulse"
                  style={{
                    width:8,
                    height:8,
                    borderRadius:"50%",
                    background:"#00d4ff"
                  }}
                />

                <div
                  style={{
                    fontFamily:"'Share Tech Mono',monospace",
                    fontSize:11,
                    color:"rgba(255,255,255,.75)"
                  }}
                >
                  PROPERTY:
                  <span
                    style={{
                      color:"#00d4ff",
                      marginLeft:8
                    }}
                  >
                    {street.toUpperCase()}
                  </span>
                </div>

              </div>

            </div>

            <div
              style={{
                display:"grid",
                gridTemplateColumns:"1fr 1fr 1fr",
                gap:10,
                marginBottom:20
              }}
            >

              <div
                style={{
                  background:"rgba(255,255,255,.03)",
                  border:"1px solid rgba(255,255,255,.08)",
                  borderRadius:12,
                  padding:14
                }}
              >

                <div
                  style={{
                    color:"rgba(255,255,255,.35)",
                    fontSize:10,
                    marginBottom:6
                  }}
                >
                  INTEGRITY
                </div>

                <div
                  style={{
                    color:
                      integrity > 70
                      ? "#10b981"
                      : integrity > 40
                      ? "#f59e0b"
                      : "#ff3b5c",
                    fontWeight:700,
                    fontSize:22
                  }}
                >
                  {integrity}%
                </div>

              </div>

              <div
                style={{
                  background:"rgba(255,255,255,.03)",
                  border:"1px solid rgba(255,255,255,.08)",
                  borderRadius:12,
                  padding:14
                }}
              >

                <div
                  style={{
                    color:"rgba(255,255,255,.35)",
                    fontSize:10,
                    marginBottom:6
                  }}
                >
                  GAPS FOUND
                </div>

                <div
                  style={{
                    color:"#ff3b5c",
                    fontWeight:700,
                    fontSize:22
                  }}
                >
                  {selected.size}
                </div>

              </div>

              <div
                style={{
                  background:"rgba(255,255,255,.03)",
                  border:"1px solid rgba(255,255,255,.08)",
                  borderRadius:12,
                  padding:14
                }}
              >

                <div
                  style={{
                    color:"rgba(255,255,255,.35)",
                    fontSize:10,
                    marginBottom:6
                  }}
                >
                  THREAT
                </div>

                <div
                  style={{
                    color:
                      selected.size > 4
                      ? "#ff3b5c"
                      : selected.size > 1
                      ? "#f59e0b"
                      : "#10b981",
                    fontWeight:700,
                    fontSize:22
                  }}
                >
                  {
                    selected.size > 4
                    ? "HIGH"
                    : selected.size > 1
                    ? "MED"
                    : "LOW"
                  }
                </div>

              </div>

            </div>

            <div
              style={{
                background:"rgba(255,255,255,.02)",
                border:"1px solid rgba(255,255,255,.08)",
                borderRadius:18,
                padding:16,
                position:"relative",
                overflow:"hidden",
                marginBottom:20
              }}
            >

              <div
                style={{
                  position:"absolute",
                  left:0,
                  right:0,
                  top:`${scanY}%`,
                  height:2,
                  background:
                    "linear-gradient(90deg,transparent,#00d4ff,transparent)"
                }}
              />

              <div
                style={{
                  marginBottom:14,
                  color:"rgba(255,255,255,.45)",
                  fontSize:12
                }}
              >
                TAP ZONES TO FLAG AS UNPROTECTED
              </div>

              <div
                style={{
                  display:"grid",
                  gridTemplateColumns:"1fr 1fr 1fr",
                  gridTemplateRows:"1fr 1fr 1fr",
                  gap:8,
                  height:320
                }}
              >

                {
                  ROOMS.map(room=>{

                    const active = selected.has(room.id);

                    const rc = COLORS[room.risk];

                    return(

                      <button
                        key={room.id}
                        onClick={()=>toggleRoom(room.id)}
                        onMouseEnter={()=>setHovered(room.id)}
                        onMouseLeave={()=>setHovered(null)}
                        style={{
                          gridColumn:room.col,
                          gridRow:room.row,
                          borderRadius:12,
                          border:
                            active
                            ? `1px solid ${rc.border}`
                            : "1px solid rgba(255,255,255,.08)",
                          background:
                            active
                            ? rc.bg
                            : "rgba(255,255,255,.03)",
                          color:"white",
                          cursor:"pointer",
                          transition:".2s",
                          boxShadow:
                            active
                            ? `0 0 20px ${rc.glow}`
                            : "none"
                        }}
                      >

                        <div
                          style={{
                            fontWeight:700,
                            marginBottom:6,
                            fontSize:14
                          }}
                        >
                          {room.label}
                        </div>

                        {
                          active && (

                            <div
                              style={{
                                color:rc.text,
                                fontSize:11
                              }}
                            >
                              {room.risk} RISK
                            </div>

                          )
                        }

                      </button>

                    );

                  })
                }

              </div>

            </div>

          </>
        )
      }

    </div>

  );

}

ReactDOM.createRoot(
  document.getElementById("root")
).render(<App />);

</script>

</body>
</html>
